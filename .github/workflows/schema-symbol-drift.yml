name: schema-symbol-drift
on:
  push:
    branches: [main]
    paths:
      - "src/generated/api/**"
      - "linter-scripts/check-schema-symbol-drift.py"
      - ".github/workflows/schema-symbol-drift.yml"
  pull_request:
    paths:
      - "src/generated/api/**"
      - "linter-scripts/check-schema-symbol-drift.py"
      - ".github/workflows/schema-symbol-drift.yml"
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check schema symbol drift
        run: python3 linter-scripts/check-schema-symbol-drift.py
