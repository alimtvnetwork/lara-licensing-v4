name: release

# Plan 09 step 77. Triggered on version tags (v*). Builds the two cPanel
# zips via run.sh, uploads them plus checksums.txt as GitHub Release assets,
# and verifies the tag matches package.json (fail fast on drift).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build (branch or tag)
        required: true
        default: main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, intl, xml, curl, zip, sqlite, pdo_sqlite
          coverage: none

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Read version from package.json
        id: pkg
        run: |
          VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Verify tag matches package.json (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="${{ steps.pkg.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR [30]: tag v$TAG does not match package.json version $PKG" >&2
            exit 30
          fi

      - name: Version sync guard
        run: python3 linter-scripts/check-version-sync.py

      - name: Build release artifacts
        run: |
          chmod +x run.sh
          ./run.sh

      - name: Upload workflow artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: release-v${{ steps.pkg.outputs.version }}
          path: |
            release/frontend-v${{ steps.pkg.outputs.version }}.zip
            release/backend-v${{ steps.pkg.outputs.version }}.zip
            release/licensing-portal-v${{ steps.pkg.outputs.version }}.zip
            release/checksums.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.pkg.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/frontend-v${{ steps.pkg.outputs.version }}.zip
            release/backend-v${{ steps.pkg.outputs.version }}.zip
            release/licensing-portal-v${{ steps.pkg.outputs.version }}.zip
            release/checksums.txt

